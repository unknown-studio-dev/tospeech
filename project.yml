name: ToSpeech
options:
  bundleIdPrefix: com.unknownstudio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: Y8DVMS7BH2
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.7
targets:
  ToSpeech:
    type: application
    platform: macOS
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: Speech.framework
      - sdk: Translation.framework
      - sdk: WebKit.framework
      - sdk: Accelerate.framework
      - package: ONNXRuntime
        product: onnxruntime
      - package: FluidAudio
        product: FluidAudio
      - target: RubberBandRender
        embed: false
    # These guards and staging steps must run on every build: they re-verify
    # pinned checksums and re-codesign helpers, so making them incremental would
    # change that posture. They declare no inputs/outputs so Xcode always runs
    # them (an older trick — a declared stamp the script never wrote — stopped
    # working: Xcode 26 skipped the phases and shipped a stale checksums.json).
    preBuildScripts:
      - name: Check shared UI component usage
        script: bash "${SRCROOT}/scripts/xcode/check-ui-components.sh"
    postBuildScripts:
      - name: Stage DeepFilterNet3 audio enhancement
        script: bash "${SRCROOT}/scripts/xcode/stage-deepfilternet.sh"
      - name: Stage Rubber Band helper
        script: bash "${SRCROOT}/scripts/xcode/stage-rubberband.sh"
      - name: Stage verified import toolchain
        script: bash "${SRCROOT}/scripts/xcode/stage-toolchain.sh"
      - name: Stage local word alignment package
        script: bash "${SRCROOT}/scripts/xcode/stage-alignment.sh"
      - name: Stage Phone Scorer package
        script: bash "${SRCROOT}/scripts/xcode/stage-phone-scorer.sh"
      - name: Stage verified UK Reference package
        script: bash "${SRCROOT}/scripts/xcode/stage-uk-reference.sh"
      # PhoneticXeus native ONNX: the small xeus.onnx graph + vocab/head/thresholds ship in every
      # configuration; the 2,3 GB xeus.onnx.data downloads at onboarding / first run, never bundled.
      - name: Stage PhoneticXeus ONNX graph
        script: bash "${SRCROOT}/scripts/xcode/stage-xeus-onnx.sh"
    sources:
      - path: ToSpeech
        excludes: [Resources]
      - path: ToSpeech/Resources
        excludes: [PhonemeAudio]
        buildPhase: resources
      # Raw phoneme clips keep their uk/us folders (same file names in both), so
      # they ship as a folder reference instead of being flattened.
      - path: ToSpeech/Resources/PhonemeAudio
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unknownstudio.tospeech
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ToSpeech
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Unknown Studio (pirumu)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ToSpeech records your shadowing takes when you explicitly start recording.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: ToSpeech uses on-device speech recognition to prepare transcript and word timing for imported lessons.
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        # Ad-hoc ("-") signing can't carry a hardened runtime, so Xcode disables
        # it and logs a note on every Debug build. Release keeps it on for
        # notarization once a real signing identity is available.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_IDENTITY: "Developer ID Application"
    entitlements:
      path: ToSpeech/App/ToSpeech.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
  ToSpeechTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ToSpeechTests]
    dependencies:
      - target: ToSpeech
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RubberBandRender:
    type: tool
    platform: macOS
    sources:
      - path: ThirdParty/RubberBand/single/RubberBandSingle.cpp
        compilerFlags: "-O3"
      - path: ThirdParty/RubberBand/helper/rubberband-render.cpp
        compilerFlags: "-O3"
    dependencies:
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_NAME: rubberband-render
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/ThirdParty/RubberBand"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_OPTIMIZATION_LEVEL: 3
      configs:
        # Embedded helper must be hardened + Developer ID signed for notarization.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_IDENTITY: "Developer ID Application"

schemes:
  ToSpeech:
    build:
      targets:
        ToSpeech: all
    test:
      targets: [ToSpeechTests]